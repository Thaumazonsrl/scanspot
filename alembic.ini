# Alembic configuration.
#
# The DSN is deliberately NOT set here: env.py reads it from SCANSPOT_DB_URL so
# that migrations and the application can never disagree about which database
# they are talking to.
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = app/store/migrations
prepend_sys_path = .
# Both are needed: version_path_separator for older Alembic, path_separator for
# 1.16+, which warns when only the legacy key is present.
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
