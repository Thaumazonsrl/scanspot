name: Release image

# Publishes the container image to GitHub Container Registry so that deployments
# can `docker compose up -d` without building anything locally.
#
# Triggered by a version tag:   git tag -a v1.0.1 -m "…" && git push origin v1.0.1
# Or manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed only for the linux/arm64 build. Drop this step and the arm64
      # platform below if you only ever deploy on x86 — it roughly halves the
      # workflow runtime, because arm64 is built under QEMU emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Automatically provided by Actions. No PAT needed for this.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower-cased automatically — GHCR rejects uppercase in image names,
          # and the org is "Thaumazonsrl".
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Only a final release moves `latest`. Without this guard a
            # prerelease such as v2.0.0-alpha.1 would silently become the tag
            # everyone pulls by default.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Feeds the OCI version label in the Dockerfile. metadata-action
          # strips the leading "v", so v1.0.1 becomes 1.0.1.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
