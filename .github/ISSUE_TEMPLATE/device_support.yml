name: Device not identified correctly
description: A switch shows up as "Enterprise <n>", keeps the Generic type, or returns no MAC table.
labels: ["device-support"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful kind of issue for this project, and usually the
        easiest to fix — most of the time it is one line in `ENTERPRISES` or one
        regex in `_SYSDESCR_RULES`, both in `app/identity.py`.

        The values below are all readable with a read-only SNMP credential and
        contain nothing sensitive, but **redact your community string** if it
        appears in any command you paste.

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - Manufacturer shows as "Enterprise <number>"
        - Model or OS version is wrong or missing
        - Device keeps the "Generic Switch" type
        - Switch returns 0 FDB entries (no MACs discovered)
        - Every endpoint appears on a single port
        - Other
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Vendor, model and OS version
      placeholder: "Alcatel OmniSwitch 6450, AOS 6.7.2.R08"
    validations:
      required: true

  - type: input
    id: sysobjectid
    attributes:
      label: sysObjectID
      description: "`snmpget -v2c -c <community> -Oqn <host> .1.3.6.1.2.1.1.2.0`"
      placeholder: ".1.3.6.1.4.1.6486.801.1.1.2.1.11.1.1"
    validations:
      required: true

  - type: textarea
    id: sysdescr
    attributes:
      label: sysDescr
      description: "`snmpget -v2c -c <community> -Oqn <host> .1.3.6.1.2.1.1.1.0` — verbatim, please."
      render: text
    validations:
      required: true

  - type: textarea
    id: entity
    attributes:
      label: ENTITY-MIB chassis row (optional)
      description: "`snmpwalk -v2c -c <community> -Oqn <host> .1.3.6.1.2.1.47.1.1.1.1.13` — this is where the real model comes from."
      render: text
