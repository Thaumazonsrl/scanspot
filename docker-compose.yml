###############################################################################
# scanspot — deployment against an existing NetBox.
#
#   cp .env.example .env     # set NETBOX_URL and NETBOX_TOKEN
#   docker compose up -d
#
# This pulls a published image; nothing is built locally. The package lives in
# GitHub Container Registry and inherits the repository's visibility, so if the
# repo is private you must authenticate once on each host:
#
#   echo <TOKEN> | docker login ghcr.io -u <github-username> --password-stdin
#
# To build from source instead (contributors, or an air-gapped host):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
###############################################################################

services:

  scanner:
    image: ghcr.io/thaumazonsrl/scanspot:1.0.0
    container_name: scanspot
    restart: unless-stopped

    # Optional so that `docker compose config` works on a fresh clone. If .env
    # is missing at run time the scanner exits with "NETBOX_TOKEN is not set",
    # which is a far more useful message than a compose file-not-found error.
    env_file:
      - path: .env
        required: false

    ports:
      # The API, and its OpenAPI docs at /api/docs. Drop this mapping to keep
      # scanspot reachable only from inside the compose network, or set
      # API_ENABLED=false to not start the server at all.
      #
      # It speaks plain HTTP: put TLS in front of it if it leaves the
      # management network.
      - "${API_PORT:-8080}:8080"

    volumes:
      # Credential profiles and the optional first-run seed.
      - ./inventory.yml:/app/inventory.yml:ro
      # Cycle heartbeat and the "already seeded" marker. Keep it: deleting this
      # volume replays the seed.
      - scanner-state:/app/state

    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Generous on purpose: the first cycle may walk a large SNMP forwarding
      # database before it can report in.
      start_period: 600s

volumes:
  scanner-state:

###############################################################################
# If your NetBox runs in Docker on this same host, put scanspot on its network
# so NETBOX_URL can use the service name instead of a published port:
#
#   services:
#     scanner:
#       networks: [netbox_default]
#   networks:
#     netbox_default:
#       external: true
#
# and set NETBOX_URL=http://netbox:8080 in .env.
#
# ── A warning worth reading before you deploy on a corporate LAN ─────────────
# Docker allocates compose networks from 172.17.0.0/12 by default, which is a
# very common corporate LAN range. When the bridge overlaps the LAN, containers
# silently lose the ability to reach the real network: packets for a switch are
# delivered on the bridge instead of being routed out, and scanspot reports
# every device as unreachable with no visible cause.
#
# Check it before the first run, and pin a free range if it collides:
#
#   networks:
#     default:
#       ipam:
#         driver: default
#         config:
#           - subnet: 10.89.7.0/24
###############################################################################
